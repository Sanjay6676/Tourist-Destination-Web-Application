{% extends 'tour/layouts/main.html' %}

{% load static %}

{% block title %}
        Tourist Destinations | Edit profile
{% endblock title %}

{% block content %}

<section class="my-4">
        <div class="container">
                <div class="row justify-content-center">
                        <div class="col-5">
                                <div class="card bg-dark bg-gradient py-4 text-light" style="box-shadow: 0px 0px 20px rgb(9, 186, 240); border-radius: 20px;">
                                        <div class="my-4" style="display: flex; flex-direction: column; align-items: center;">
                                                <h4 class="text-danger">Update Profile</h4>
                                                {% include 'tour/inc/message.html' %}
                                        </div>
                                        <form action="" method="post">
                                                {% csrf_token %}
                                                <div class="m-3">
                                                        <label for="username" class="form-label">First Name</label>
                                                        {{form.f_name}}
                                                </div>
                                                <div class="m-4">
                                                        <label for="password" class="form-label">Last Name</label>
                                                        {{form.l_name}}
                                                </div>
                                                <div class="m-4">
                                                        <label for="password" class="form-label">Contact Number</label>
                                                        {{form.contact_no}}
                                                </div>

                                                <div class="mb-4" style="display: flex; flex-direction: column; align-items: center;">
                                                        <button type="submit" class="btn btn-outline-info">Update</button>
                                    
                                                </div>

                                        </form>
                                </div>
                        </div>
                </div>
        </div>
</section>

{% endblock content %}
